appId: com.squeek.desktop
productName: Squeek
asar: true
directories:
  output: artifacts/installer
files:
  - dist/desktop/**
  - package.json
extraResources:
  - from: artifacts/observer
    to: observer
    filter:
      - '**/*'
      - '!*.pdb'
win:
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
  icon: dist/desktop/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Squeek-Setup-${version}.${ext}
