# XcodeGen spec. Generate the project with:  cd apps/ios && xcodegen
# Clickey.xcodeproj is generated and git-ignored; edit this file instead.
name: Clickey

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Clickey.xcconfig
  Release: Config/Clickey.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: $(CLICKEY_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  ClickeyCore:
    path: ClickeyCore
  # Polished transitions and change effects (open source, by Moving Parts / Emerge Tools).
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "0.3.1"

# Keys every target's Info.plist carries, so Shared/ClickeyConfig.swift works in extensions too.
x-shared-info: &sharedInfo
  ClickeySupabaseHost: $(SUPABASE_HOST)
  ClickeySupabaseAnonKey: $(SUPABASE_ANON_KEY)
  ClickeyAppGroup: $(CLICKEY_APP_GROUP)
  ClickeyKeychainGroup: $(AppIdentifierPrefix)$(CLICKEY_BUNDLE_ID).shared
  ClickeyAppBundleId: $(CLICKEY_BUNDLE_ID)
  CFBundleDisplayName: Clickey
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)

targets:
  Clickey:
    type: application
    platform: iOS
    sources:
      - Clickey
      - Shared
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ClickeyCore
      - package: Pow
      - target: CallDirectoryExtension
      - target: MessageFilterExtension
      - target: ShareExtension
      - target: SafariExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKEY_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Only capabilities a free Personal Team can sign: App Groups and Keychain Sharing.
        CODE_SIGN_ENTITLEMENTS: Clickey/Clickey.entitlements
    info:
      path: Clickey/Info.plist
      properties:
        <<: *sharedInfo
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: Clickey sign-in
            CFBundleURLSchemes: [clickey]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(CLICKEY_BUNDLE_ID).refresh]
        NSCameraUsageDescription: Clickey uses the camera to scan the code shown by Clickey on your computer.
        NSPhotoLibraryUsageDescription: Clickey reads the words in a screenshot you choose, on your iPhone, to check it for scams.
        ITSAppUsesNonExemptEncryption: false

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources: [CallDirectoryExtension]
    dependencies:
      - package: ClickeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKEY_BUNDLE_ID).CallDirectory
    info:
      path: CallDirectoryExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Clickey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: CallDirectoryExtension/CallDirectoryExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(CLICKEY_APP_GROUP)]

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilterExtension
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: ClickeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKEY_BUNDLE_ID).MessageFilter
    info:
      path: MessageFilterExtension/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    entitlements:
      path: MessageFilterExtension/MessageFilterExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(CLICKEY_APP_GROUP)]

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ClickeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKEY_BUNDLE_ID).Share
    info:
      path: ShareExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Check with Clickey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(CLICKEY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(CLICKEY_BUNDLE_ID).shared]

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes: [Resources]
      # Web extension files go at the root of the .appex; images/ keeps its folder.
      - path: SafariExtension/Resources
        excludes: [images]
        buildPhase: resources
      - path: SafariExtension/Resources/images
        type: folder
        buildPhase: resources
      - Shared
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ClickeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLICKEY_BUNDLE_ID).Safari
    info:
      path: SafariExtension/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(CLICKEY_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(CLICKEY_BUNDLE_ID).shared]

schemes:
  Clickey:
    build:
      targets:
        Clickey: all
    run:
      config: Debug
