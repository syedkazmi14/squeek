# XcodeGen spec. Generate the project with:  cd apps/ios && xcodegen
# Squeek.xcodeproj is generated and git-ignored; edit this file instead.
name: Squeek

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Squeek.xcconfig
  Release: Config/Squeek.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: $(SQUEEK_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  SqueekCore:
    path: SqueekCore
  # Polished transitions and change effects (open source, by Moving Parts / Emerge Tools).
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "0.3.1"

# Keys every target's Info.plist carries, so Shared/SqueekConfig.swift works in extensions too.
x-shared-info: &sharedInfo
  SqueekSupabaseHost: $(SUPABASE_HOST)
  SqueekSupabaseAnonKey: $(SUPABASE_ANON_KEY)
  SqueekAppGroup: $(SQUEEK_APP_GROUP)
  SqueekKeychainGroup: $(AppIdentifierPrefix)$(SQUEEK_BUNDLE_ID).shared
  SqueekAppBundleId: $(SQUEEK_BUNDLE_ID)
  CFBundleDisplayName: Squeek
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)

targets:
  Squeek:
    type: application
    platform: iOS
    sources:
      - Squeek
      - Shared
      - LiveActivity
      - path: Fonts
        buildPhase: resources
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SqueekCore
      - package: Pow
      - target: SqueekWidgets
      - target: ScreenGuardExtension
      - target: CallDirectoryExtension
      - target: MessageFilterExtension
      - target: ShareExtension
      - target: SafariExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Only capabilities a free Personal Team can sign: App Groups and Keychain Sharing.
        CODE_SIGN_ENTITLEMENTS: Squeek/Squeek.entitlements
    info:
      path: Squeek/Info.plist
      properties:
        <<: *sharedInfo
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: Squeek sign-in
            CFBundleURLSchemes: [squeek]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(SQUEEK_BUNDLE_ID).refresh]
        NSCameraUsageDescription: Squeek uses the camera to scan the code shown by Squeek on your computer.
        ITSAppUsesNonExemptEncryption: false

  SqueekWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SqueekWidgets
      - LiveActivity
      - Shared/Assets.xcassets
      - path: Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).Widgets
    info:
      path: SqueekWidgets/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Squeek
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Optional Screen Guard: a broadcast the person starts from the app. It reads the screen's text on
  # the phone every 30 seconds. See ScreenGuardExtension/SampleHandler.swift.
  ScreenGuardExtension:
    type: app-extension
    platform: iOS
    sources:
      - ScreenGuardExtension
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: SqueekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).ScreenGuard
    info:
      path: ScreenGuardExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Squeek Screen Guard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: ScreenGuardExtension/ScreenGuardExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SQUEEK_APP_GROUP)]

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources: [CallDirectoryExtension]
    dependencies:
      - package: SqueekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).CallDirectory
    info:
      path: CallDirectoryExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Squeek
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: CallDirectoryExtension/CallDirectoryExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SQUEEK_APP_GROUP)]

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilterExtension
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: SqueekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).MessageFilter
    info:
      path: MessageFilterExtension/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    entitlements:
      path: MessageFilterExtension/MessageFilterExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SQUEEK_APP_GROUP)]

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: Fonts
        buildPhase: resources
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SqueekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).Share
    info:
      path: ShareExtension/Info.plist
      properties:
        <<: *sharedInfo
        CFBundleDisplayName: Check with Squeek
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SQUEEK_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(SQUEEK_BUNDLE_ID).shared]

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes: [Resources]
      # Web extension files go at the root of the .appex; images/ keeps its folder.
      - path: SafariExtension/Resources
        excludes: [images]
        buildPhase: resources
      - path: SafariExtension/Resources/images
        type: folder
        buildPhase: resources
      - Shared
      - path: ../../packages/detection/rules/rules.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SqueekCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SQUEEK_BUNDLE_ID).Safari
    info:
      path: SafariExtension/Info.plist
      properties:
        <<: *sharedInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(SQUEEK_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(SQUEEK_BUNDLE_ID).shared]

schemes:
  Squeek:
    build:
      targets:
        Squeek: all
    run:
      config: Debug
